name: Deploy Frontend to AKS

on:
  push:
    branches: 
      - main

env:
  AZURE_SUBSCRIPTION_ID: "5e683e0f-b00c-48d6-9769-5aaf598de8f1"
  AZURE_RESOURCE_GROUP: "rg-shared-prf2026"
  AKS_CLUSTER_NAME: "aks-nonprod-prf2026"
  NAMESPACE: "franck-barry"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Azure Login via OIDC
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
        enable-AzPSSession: true

    - name: Set up kubelogin
      uses: Azure/use-kubelogin@v1
      with:
        kubelogin-version: 'v0.1.4'

    - name: Configurer kubectl (AKS)
      run: |
        az aks get-credentials --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing
        kubelogin convert-kubeconfig -l azurecli

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s/ -n ${{ env.NAMESPACE }}
        kubectl rollout restart deployment/frontend-app -n ${{ env.NAMESPACE }}